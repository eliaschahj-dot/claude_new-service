<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — AI Chat</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <a class="back" href="index.html">‹</a>
    <span class="title" data-i18n="chatTitle"></span>
    <button class="lang">🌐</button>
  </header>

  <main class="chat-main" id="chatLog">
    <p class="disclaimer" data-i18n="aiDisclaimer"></p>
    <!-- messages are appended here by chat.js -->
  </main>

  <div class="chat-input">
    <input id="chatText" type="text" data-i18n-ph="chatPlaceholder" autocomplete="off">
    <button id="chatSend" aria-label="send">➤</button>
  </div>

  <nav class="tabbar">
    <a href="index.html"><span class="ico">🏠</span><span data-i18n="tabHome"></span></a>
    <a class="on" href="chat.html"><span class="ico">💬</span><span data-i18n="tabChat"></span></a>
    <a href="documents.html"><span class="ico">📄</span><span data-i18n="tabDocs"></span></a>
    <a href="status.html"><span class="ico">📍</span><span data-i18n="tabStatus"></span></a>
    <a href="profile.html"><span class="ico">👤</span><span data-i18n="tabMy"></span></a>
  </nav>

</div>
<script src="js/i18n.js"></script>
<script src="data/visas.js"></script>
<script src="js/chat.js"></script>
</body>
</html>
