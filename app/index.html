<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — Home</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <span class="logo">K-Visa Assist</span>
    <button class="lang">🌐</button>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroDesc"></p>
      <a class="btn" href="chat.html" data-i18n="heroCta"></a>
    </section>

    <section>
      <p class="section-title" data-i18n="quickMenu"></p>
      <div class="quick-grid" style="margin-top:10px">
        <a href="visas.html"><span class="ico">🛂</span><span data-i18n="qVisaInfo"></span></a>
        <a href="documents.html"><span class="ico">📄</span><span data-i18n="qDocs"></span></a>
        <a href="status.html"><span class="ico">📍</span><span data-i18n="qStatus"></span></a>
        <a href="status.html"><span class="ico">👤</span><span data-i18n="qExpert"></span></a>
      </div>
    </section>

    <section>
      <p class="section-title" data-i18n="ongoing"></p>
      <a class="card case-summary" href="status.html" style="margin-top:10px">
        <span class="dot">🛂</span>
        <span class="info">
          <b data-i18n="caseTitle"></b>
          <span class="muted" data-i18n="caseSub"></span>
        </span>
        <span class="badge badge-blue" data-i18n="inProgress"></span>
      </a>
    </section>

    <section>
      <p class="section-title" data-i18n="popular"></p>
      <div class="card visa-card" style="margin-top:10px">
        <div class="head">
          <span class="code">D-2</span>
          <b data-i18n="d2Name"></b>
          <span class="badge badge-gray" style="margin-left:auto" data-i18n="popularBadge"></span>
        </div>
        <p class="muted" data-i18n="d2Desc"></p>
      </div>
      <div class="card visa-card" style="margin-top:10px">
        <div class="head">
          <span class="code">E-7</span>
          <b data-i18n="e7Name"></b>
        </div>
        <p class="muted" data-i18n="e7Desc"></p>
      </div>
      <a class="btn btn-ghost" href="visas.html" style="margin-top:12px" data-i18n="viewAll"></a>
    </section>

    <p class="disclaimer" data-i18n="homeDisclaimer"></p>
  </main>

  <nav class="tabbar">
    <a class="on" href="index.html"><span class="ico">🏠</span><span data-i18n="tabHome"></span></a>
    <a href="chat.html"><span class="ico">💬</span><span data-i18n="tabChat"></span></a>
    <a href="documents.html"><span class="ico">📄</span><span data-i18n="tabDocs"></span></a>
    <a href="status.html"><span class="ico">📍</span><span data-i18n="tabStatus"></span></a>
    <a href="profile.html"><span class="ico">👤</span><span data-i18n="tabMy"></span></a>
  </nav>

</div>
<script src="js/i18n.js"></script>
</body>
</html>
