<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — Status</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <a class="back" href="index.html">‹</a>
    <span class="title" data-i18n="statusTitle"></span>
    <button class="lang">🌐</button>
  </header>

  <main>
    <div class="card case-summary">
      <span class="dot">🛂</span>
      <span class="info">
        <b data-i18n="caseTitle"></b>
        <span class="muted"><span data-i18n="applyNo"></span>: KVA-2026-0142</span>
      </span>
      <span class="badge badge-blue" data-i18n="inProgress"></span>
    </div>

    <div class="card">
      <p class="section-title" style="margin-bottom:16px" data-i18n="stepsTitle"></p>
      <ul class="timeline" id="statusTimeline"></ul>
    </div>

    <div class="card agent-card">
      <span class="photo">👤</span>
      <span class="info">
        <b data-i18n="agentName"></b>
        <span data-i18n="agentDesc"></span>
      </span>
      <button class="action" data-i18n="msgBtn" style="border:1.5px solid var(--primary);color:var(--primary);background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:.8rem"></button>
    </div>

    <a class="btn btn-primary" href="documents.html" data-i18n="supplement"></a>

    <p class="disclaimer" data-i18n="statusDisclaimer"></p>
  </main>

  <nav class="tabbar">
    <a href="index.html"><span class="ico">🏠</span><span data-i18n="tabHome"></span></a>
    <a href="chat.html"><span class="ico">💬</span><span data-i18n="tabChat"></span></a>
    <a href="documents.html"><span class="ico">📄</span><span data-i18n="tabDocs"></span></a>
    <a class="on" href="status.html"><span class="ico">📍</span><span data-i18n="tabStatus"></span></a>
    <a href="profile.html"><span class="ico">👤</span><span data-i18n="tabMy"></span></a>
  </nav>

</div>
<script src="js/i18n.js"></script>
<script>
// 데모 타임라인 (KO/EN) — 실제로는 case_events API에서 로드
const steps = [
  { st: "done", t: { ko: "AI 상담 완료", en: "AI consultation done" }, d: { ko: "비자 유형 확정: E-7 · 7월 10일", en: "Visa type confirmed: E-7 · Jul 10" } },
  { st: "done", t: { ko: "신청 정보 입력", en: "Application info entered" }, d: { ko: "기본 정보·고용 정보 입력 완료 · 7월 11일", en: "Personal & employment info completed · Jul 11" } },
  { st: "now",  t: { ko: "서류 준비 및 검토", en: "Documents & review" }, d: { ko: "3/5 서류 승인 · 학위증명서 보완 요청됨", en: "3/5 documents approved · degree certificate needs re-upload" } },
  { st: "",     t: { ko: "행정사 최종 검토 · 결제", en: "Final review & payment" }, d: { ko: "대행 수수료 결제 후 접수가 진행됩니다", en: "Filing proceeds after the service fee is paid" } },
  { st: "",     t: { ko: "출입국 접수 (대행)", en: "Filed with immigration" }, d: { ko: "하이코리아 전자민원 또는 방문 접수", en: "Via HiKorea e-application or in person" } },
  { st: "",     t: { ko: "심사 결과 통보", en: "Decision" }, d: { ko: "승인 / 보완 / 불허 결과 알림", en: "Approved / supplement / denied notification" } },
];
document.getElementById("statusTimeline").innerHTML = steps.map((s, i) => `
  <li class="${s.st}">
    <span class="node">${s.st === "done" ? "✓" : i + 1}</span>
    <span class="t-info"><b>${t(s.t)}</b><span>${t(s.d)}</span></span>
  </li>`).join("");
</script>
</body>
</html>
