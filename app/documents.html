<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — Documents</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <a class="back" href="index.html">‹</a>
    <span class="title" data-i18n="docsPageTitle"></span>
    <button class="lang">🌐</button>
  </header>

  <main>
    <div class="card">
      <div id="docHead"></div>
      <div class="progress-wrap">
        <div class="progress-bar"><i id="docProgress" style="width:0%"></i></div>
        <span class="muted" id="docCount" style="white-space:nowrap"></span>
      </div>
      <p class="muted" style="margin-top:10px" data-i18n="docsAutoNote"></p>
    </div>

    <div class="card" id="docList"></div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="chat.html" data-i18n="askDocs"></a>
      <a class="btn btn-primary" href="status.html" data-i18n="submitDone"></a>
    </div>

    <p class="disclaimer" data-i18n="docsDisclaimer"></p>
  </main>

  <nav class="tabbar">
    <a href="index.html"><span class="ico">🏠</span><span data-i18n="tabHome"></span></a>
    <a href="chat.html"><span class="ico">💬</span><span data-i18n="tabChat"></span></a>
    <a class="on" href="documents.html"><span class="ico">📄</span><span data-i18n="tabDocs"></span></a>
    <a href="status.html"><span class="ico">📍</span><span data-i18n="tabStatus"></span></a>
    <a href="profile.html"><span class="ico">👤</span><span data-i18n="tabMy"></span></a>
  </nav>

</div>
<script src="js/i18n.js"></script>
<script src="data/visas.js"></script>
<script src="js/documents.js"></script>
</body>
</html>
