<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — 서류 제출</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">서류 제출</span>
  </header>

  <main>
    <div class="card">
      <div id="docHead"></div>
      <div class="progress-wrap">
        <div class="progress-bar"><i id="docProgress" style="width:0%"></i></div>
        <span class="muted" id="docCount" style="white-space:nowrap"></span>
      </div>
      <p class="muted" style="margin-top:10px">AI 상담 결과로 자동 생성된 목록입니다.

    </div>

    <div class="card" id="docList"></div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="chat.html">💬 서류 질문하기</a>
      <a class="btn btn-primary" href="status.html">제출 완료</a>
    </div>

    <p class="disclaimer">업로드된 서류는 암호화되어 저장되며, 대행 업무 목적 외에는 사용되지 않습니다.</p>
  </main>

  <nav class="tabbar">
    <a href="index.html"><span class="ico">🏠</span>홈</a>
    <a href="chat.html"><span class="ico">💬</span>챗봇</a>

    <a href="status.html"><span class="ico">📍</span>상태</a>
    <a href="profile.html"><span class="ico">👤</span>MY</a>
  </nav>

</div>
<script src="data/visas.js"></script>
