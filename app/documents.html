<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Visa Assist — 서류 제출</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="phone">

  <header class="appbar">
    <a class="back" href="index.html">‹</a>
    <span class="title">서류 제출</span>
  </header>

  <main>
    <div class="card">
      <div class="head" style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <span class="badge badge-blue">E-7 특정활동</span>
        <b style="font-size:.95rem">서류 체크리스트</b>
      </div>
      <div class="progress-wrap">
        <div class="progress-bar"><i style="width:40%"></i></div>
        <span class="muted" style="white-space:nowrap"><b>2</b> / 5 완료</span>
      </div>
      <p class="muted" style="margin-top:10px">AI 상담 내용을 바탕으로 자동 생성된 목록입니다.
      사진 촬영 또는 파일 업로드로 제출해 주세요.</p>
    </div>

    <div class="card">
      <div class="doc-item">
        <span class="ico">🛂</span>
        <span class="info">
          <b>여권 사본</b>
          <span class="badge badge-green">승인 완료</span>
        </span>
        <button class="action">보기</button>
      </div>
      <div class="doc-item">
        <span class="ico">📷</span>
        <span class="info">
          <b>증명사진 (3.5×4.5cm)</b>
          <span class="badge badge-green">승인 완료</span>
        </span>
        <button class="action">보기</button>
      </div>
      <div class="doc-item">
        <span class="ico">📑</span>
        <span class="info">
          <b>고용계약서</b>
          <span class="badge badge-amber">검토 중</span>
        </span>
        <button class="action">다시 올리기</button>
      </div>
      <div class="doc-item">
        <span class="ico">🎓</span>
        <span class="info">
          <b>학위증명서 (아포스티유)</b>
          <span class="badge badge-red">보완 요청</span><br>
          <span>행정사 메모: 아포스티유 확인 페이지가 누락되었습니다.</span>
        </span>
        <button class="action">업로드</button>
      </div>
      <div class="doc-item">
        <span class="ico">🏢</span>
        <span class="info">
          <b>회사 사업자등록증</b>
          <span class="badge badge-gray">미제출</span>
        </span>
        <button class="action">업로드</button>
      </div>
    </div>

    <div class="btn-row">
      <a class="btn btn-ghost" href="chat.html">💬 서류 질문하기</a>
      <a class="btn btn-primary" href="status.html">제출 완료</a>
    </div>

    <p class="disclaimer">업로드된 서류는 암호화되어 저장되며, 대행 업무 목적 외에는 사용되지 않습니다.</p>
  </main>

  <nav class="tabbar">
    <a href="index.html"><span class="ico">🏠</span>홈</a>
    <a href="chat.html"><span class="ico">💬</span>챗봇</a>
    <a class="on" href="documents.html"><span class="ico">📄</span>서류</a>
    <a href="status.html"><span class="ico">📍</span>상태</a>
    <a href="profile.html"><span class="ico">👤</span>MY</a>
  </nav>

</div>
</body>
</html>
